{{- if .Values.metrics.dashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "bucket-sync.name" . }}-dashboard
  {{- with .Values.metrics.dashboard.labels }}
  labels: {{ toYaml . | nindent 4 }}
  {{- end }}
  {{- with .Values.metrics.dashboard.annotations }}
  annotations: {{ toYaml . | nindent 4 }}
  {{- end }}
data:
  bucket-sync.json: |-
    {{- .Files.Get "dashboards/bucket-sync.json" | nindent 4 }}
{{- end }}
