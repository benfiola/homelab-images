name: publish

on:
  push:
  workflow_dispatch:
    inputs:
      components:
        description: "Comma-separated components to release even without changes"
        required: false
        type: string
      all:
        description: "Release every component"
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

defaults:
  run:
    shell: nix develop --command bash -e {0}

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.plan.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@v31
      - id: plan
        run: |
          args=()
          if [ "${{ inputs.all }}" = "true" ]; then args+=(-all); fi
          args+=(-components "${{ inputs.components }}")
          echo "releases=$(go run ./scripts plan "${args[@]}")" >> "$GITHUB_OUTPUT"

  release:
    needs: plan
    if: needs.plan.outputs.releases != '[]'
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJson(needs.plan.outputs.releases) }}
    concurrency:
      group: release-${{ matrix.release.component }}
    runs-on: ubuntu-latest
    name: ${{ matrix.release.component }} ${{ matrix.release.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: cachix/install-nix-action@v31
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build
        run: go run ./scripts build ${{ matrix.release.component }} ${{ matrix.release.version }}
      - name: publish
        run: go run ./scripts publish ${{ matrix.release.component }} ${{ matrix.release.version }}
      - name: release
        run: go run ./scripts release ${{ matrix.release.component }} ${{ matrix.release.version }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
