name: docs

on:
  push:
    branches:
      - "*"

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          # renovate: datasource=node-version depName=node
          node-version: "24.22.2"
      - name: install tools
        run: BIN=/usr/local/bin make install-tools
      - name: build docs
        run: make build-docs
      - name: upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: .build

  publish-docs:
    needs: build-docs
    runs-on: ubuntu-latest
    concurrency:
      group: "${{github.workflow}}-publish-docs"
    permissions:
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: deploy docs
        id: deployment
        uses: actions/deploy-pages@v5
