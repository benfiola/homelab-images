{{define "content"}}
<dl class="details">
  <dt>Username</dt><dd>{{.Account.Username}}</dd>
  <dt>GUID</dt><dd>{{.Account.ID}}</dd>
  <dt>GM level</dt><dd>{{.Account.GMLevel}}</dd>
</dl>

<h2>Change password</h2>
<form method="post" action="/account" class="card narrow">
  <label>Current password
    <input type="password" name="old_password" autocomplete="current-password" required>
  </label>
  <label>New password
    <input type="password" name="new_password" autocomplete="new-password" required>
  </label>
  <label>Confirm new password
    <input type="password" name="new_password_confirm" autocomplete="new-password" required>
  </label>
  <button type="submit">Change password</button>
</form>
{{end}}
